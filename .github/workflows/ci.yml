name: CI

on:
  pull_request:
    branches: [master, development]

permissions:
  contents: read
  checks: write        # test results check run
  pull-requests: write # test results comment

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build :dokkaGenerate # :dokkaGenerate aggregates the API docs of all modules

      # Comments the test results on the pull request, updating the same comment on every push.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/build/test-results/**/*.xml'

      - name: Upload API docs
        uses: actions/upload-artifact@v5
        with:
          name: api-docs
          path: build/dokka/html/

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: '**/build/reports/tests/'